[package]
name = "arkhe-rbb-core"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Experimental Arkhe-RBB v3 codec, MMR and offline hybrid checkpoint verification"

# The RBB fork is standalone; no dependency on the parent Arkhe workspace.
[workspace]

[features]
default = []
rbb-pqc = ["dep:fips204"]

[dependencies]
blake3 = "=1.8.7"
ed25519-dalek = "=2.2.0"
hex = "=0.4.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
sha3 = "=0.10.8"
thiserror = "=2.0.21"
fips204 = { version = "=0.4.6", optional = true, default-features = false, features = ["ml-dsa-44"] }

[dev-dependencies]
proptest = "=1.9.0"
fips204 = { version = "=0.4.6", default-features = false, features = ["ml-dsa-44"] }
